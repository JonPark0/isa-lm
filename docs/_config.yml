# GitHub Pages (Settings → Pages → Deploy from branch: main, folder /docs)
title: Krafla
description: >-
  Portable C11 LLM inference for legacy and modern CPUs — INT8/INT4 Llama, Qwen and Gemma models on x86-64 (SSE2, SSE4.1, AVX2,
  AVX-VNNI, AVX-512 VNNI) and ARM (ARMv7 NEON, dotprod, i8mm, SVE) with compile-time kernel selection, Hugging Face
  tokenizers, chat mode and a numpy-checked reference.
url: https://jonpark0.github.io
baseurl: /krafla
# Just the Docs (https://just-the-docs.com), pinned; with the plugins below.
remote_theme: just-the-docs/just-the-docs@v0.12.0
lang: en
author:
  name: Yeochoon Park
  url: https://github.com/JonPark0
defaults:
  - scope:
      path: ""
    values:
      image: /assets/social-preview.png   # og:image, twitter:image
  - scope:
      path: google0f5a07030fefb89e.html   # Search Console ownership file
    values:
      sitemap: false
# Search engine ownership checks: paste the codes from Google Search Console
# (HTML tag method) and Bing Webmaster Tools and uncomment; jekyll-seo-tag
# writes the meta tags.
# webmaster_verifications:
#   google: CODE
#   bing: CODE
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
exclude:
  - design/2026-10-22-legacy-isa-ml-runtime-plan.md

# Just the Docs settings
color_scheme: light          # dark mode: _includes/head_custom.html and header_custom.html
search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 5
  preview_words_after: 10
  button: true
heading_anchors: true
enable_copy_code_button: true
back_to_top: true
back_to_top_text: "Back to top"
aux_links:
  "GitHub": "https://github.com/JonPark0/krafla"
  "Releases": "https://github.com/JonPark0/krafla/releases"
  "Models": "https://huggingface.co/models?other=krafla"
  "한국어": "/krafla/ko/"
aux_links_new_tab: false
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/JonPark0/krafla"
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
mermaid:
  version: "11.4.1"          # loaded only where a page sets mermaid: true
callouts:
  note:
    title: Note
    color: blue
