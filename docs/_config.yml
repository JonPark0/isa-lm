baseurl: /isa-lm
theme: jekyll-theme-cayman
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
exclude:
  - design/2026-10-22-legacy-isa-ml-runtime-plan.md
