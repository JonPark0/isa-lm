{%- comment -%} Light/dark switch, next to the search box; head_custom.html applies the choice early. {%- endcomment -%}
<button type="button" class="btn-reset theme-toggle" id="theme-toggle" aria-label="Switch between light and dark mode" title="Light / dark">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
  </svg>
</button>
<style>
  .theme-toggle { display: flex; align-items: center; padding: 0 0.75rem; color: inherit; cursor: pointer; opacity: 0.75; }
  .theme-toggle:hover, .theme-toggle:focus-visible { opacity: 1; }
</style>
<script>
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var next = jtd.getTheme() === "dark" ? "light" : "dark";
    jtd.setTheme(next);
    try { localStorage.setItem("isa-lm-theme", next); } catch (e) {}
  });
</script>
