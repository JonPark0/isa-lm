name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch/PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: x86 native + ARM under qemu
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Release version check
        # a new ML_VERSION needs its CHANGELOG.md section (auto-release.yml)
        run: scripts/release_check.sh
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ runner.arch }}-matrix-${{ hashFiles('.github/workflows/ci.yml', '.github/scripts/apt-install.sh') }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-matrix-
      - name: Install toolchains
        timeout-minutes: 15
        env:
          APT_CACHE_DIR: /home/runner/apt-cache
        # cmake is preinstalled on the runner image
        run: |
          .github/scripts/apt-install.sh \
            qemu-user gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libc6-dev-armhf-cross libc6-dev-arm64-cross \
            gcc-mingw-w64-x86-64 python3-numpy python3-pytest
      - name: Install the tokenizers library (reference for the tokenizer checks)
        run: pip install --user --break-system-packages tokenizers || echo "tokenizers unavailable, those rows will SKIP"
      - name: Host CPU features
        run: grep -o -w -E 'sse4_1|avx2|avx_vnni|avx512_vnni' /proc/cpuinfo | sort -u
      - name: Full test matrix (includes stories15M download and generation)
        timeout-minutes: 30
        run: make test-all
      - name: Tokenizer check results
        if: always()
        run: |
          r=$(cat build/test-all/tok_*.log 2>/dev/null | grep -h -E "texts match|skip" | tr '\n' ' ')
          echo "::notice title=tokenizers vs the tokenizers library::${r:-not run}"
      - name: Failure details
        if: failure()
        run: |
          # one annotation per failing check, readable without the logs
          grep -h -E "FAIL|Error|error:|assert|out of tolerance" build/test-all/*.log 2>/dev/null |
            grep -v -E "^make: |passed$" | head -n 9 | while IFS= read -r line; do echo "::error title=test-all::$line"; done
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-all-logs
          path: build/test-all/

  arm64:
    name: AArch64 native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ runner.arch }}-arm64-${{ hashFiles('.github/workflows/ci.yml', '.github/scripts/apt-install.sh') }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-arm64-
      - name: Install Python deps
        timeout-minutes: 15
        env:
          APT_CACHE_DIR: /home/runner/apt-cache
        run: .github/scripts/apt-install.sh python3-numpy python3-pytest
      - name: Host CPU features
        run: grep -m1 -i features /proc/cpuinfo
      - name: scalar
        run: make -s ISA=scalar test e2e
      - name: neon
        run: make -s ISA=neon test e2e
      - name: neon THREADS=pthread
        run: make -s ISA=neon THREADS=pthread test e2e
      - name: neon_dotprod
        run: |
          if grep -qw asimddp /proc/cpuinfo; then make -s ISA=neon_dotprod test e2e
          else echo "skip: no asimddp"; fi
      - name: neon_i8mm
        run: |
          if grep -qw i8mm /proc/cpuinfo; then make -s ISA=neon_i8mm test e2e
          else echo "skip: no i8mm"; fi
      - name: sve
        run: |
          if grep -qw sve /proc/cpuinfo; then make -s ISA=sve test e2e
          else echo "skip: no sve"; fi
      - name: Benchmark (packed vs row-major)
        run: |
          python3 tools/gen_random.py --out build/models/bench_q4.mlb --wtype q4 --dim 1024 --layers 4 --heads 16 \
            --kv-heads 4 --hidden 2816 --vocab 8192 --max-seq 256
          python3 tools/gen_random.py --out build/models/bench_q8.mlb --wtype q8 --dim 1024 --layers 4 --heads 16 \
            --kv-heads 4 --hidden 2816 --vocab 8192 --max-seq 256
          # one annotation per ISA (readable through the checks API; max 10 per step)
          isas="scalar neon neon_dotprod"; grep -qw i8mm /proc/cpuinfo && isas="$isas neon_i8mm"
          for isa in $isas; do
            make -s ISA=$isa build/$isa/ml_bench
            out=$(build/$isa/ml_bench | grep matvec | awk '{printf "%s %s %s GOPS; ", $1, $2, $5}')
            for m in q8 q4; do for p in "" --no-pack; do
              r=$(build/$isa/ml_bench build/models/bench_$m.mlb -n 64 $p | tail -1 | sed 's/^model [^:]*: //; s/ (64 tokens.*//')
              out="$out $m ${p:-packed}: $r;"
            done; done
            echo "$out"
            echo "::notice title=bench $isa::$out"
          done

  msvc:
    name: Windows MSVC
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install numpy
        run: python -m pip install numpy
      - name: Build and unit tests (CMake, MSVC)
        run: |
          # build output in a log; its error lines become annotations (logs are
          # not always at hand)
          for isa in scalar sse2 avx2; do
            cmake -S . -B build/msvc-$isa -A x64 -DML_ISA=$isa > build-$isa.log 2>&1 &&
              cmake --build build/msvc-$isa --config Release -j 4 >> build-$isa.log 2>&1 || {
                grep -E "CMake Error|error|warning C4(013|047|133)" -A2 build-$isa.log | grep -v "^--$" | head -n 9 |
                  while IFS= read -r l; do echo "::error title=msvc $isa build::$l"; done
                exit 1
              }
            grep -c "warning C" build-$isa.log | sed "s/^/$isa warnings: /"
            ctest --test-dir build/msvc-$isa -C Release --output-on-failure
          done
      - name: Logits against the numpy reference
        run: |
          T=1,5,9,13,17,21,25,29,33,37,41,45,49,53,57,61
          mkdir -p build/models
          python tools/gen_random.py --out build/models/rand_q8.mlb --wtype q8 > /dev/null
          python tools/gen_random.py --out build/models/rand_q4.mlb --wtype q4 > /dev/null
          python tools/gen_random.py --out build/models/bias_q4.mlb --wtype q4 --qkv-bias --seed 7 > /dev/null
          for m in rand_q8 rand_q4 bias_q4; do
            python tools/ref_forward.py build/models/$m.mlb --tokens $T --out build/$m.ref.f32
            for isa in scalar sse2 avx2; do for p in "" --no-pack; do
              build/msvc-$isa/Release/ml_run.exe build/models/$m.mlb --tokens $T --dump-logits build/$m.$isa.f32 $p
              python tests/compare_logits.py build/$m.$isa.f32 build/$m.ref.f32 96 1e-3 ||
                { echo "::error title=msvc logits::$m $isa ${p:-packed} differs from the reference"; exit 1; }
            done; done
          done
          echo "::notice title=msvc::scalar, sse2 and avx2 builds match the numpy reference (q8, q4, q/k/v bias; packed and row-major)"
