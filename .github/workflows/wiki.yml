name: Wiki

# Regenerates the GitHub wiki from README.md and docs/ (tools/sync_wiki.py)
# whenever they change on main.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - tools/sync_wiki.py
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: write   # the wiki is pushed with GITHUB_TOKEN

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Clone wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki
      - name: Generate pages
        run: python3 tools/sync_wiki.py wiki --repo "${{ github.repository }}"
      - name: Push
        working-directory: wiki
        run: |
          git add -A
          if git diff --cached --quiet; then echo "wiki already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from docs (${GITHUB_SHA::7})"
          git push
