name: llama.cpp comparison

# Manual: runs scripts/compare_llamacpp.sh on GitHub's x86-64 and AArch64
# runners (Qwen2.5 0.5B Instruct, Q8_0 and Q4_0, wikitext-2 perplexity). The
# results table goes to the run's summary, an artifact and one annotation.
on:
  push:
    branches: [bench/arm-compare]   # temporary: a first run before the workflow is on main
  workflow_dispatch:
    inputs:
      llama_cpp:
        description: "llama.cpp tag to compare against"
        default: b11835
        required: false
      reps:
        description: "Runs averaged per measurement"
        default: "3"
        required: false

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            runner: ubuntu-24.04
            builds: >-
              native:-DGGML_NATIVE=ON
              avx2:-DGGML_NATIVE=OFF;-DGGML_AVX512=OFF;-DGGML_AVX_VNNI=OFF;-DGGML_SSE42=ON;-DGGML_AVX=ON;-DGGML_AVX2=ON;-DGGML_BMI2=ON;-DGGML_FMA=ON;-DGGML_F16C=ON
              sse42:-DGGML_NATIVE=OFF;-DGGML_AVX512=OFF;-DGGML_AVX_VNNI=OFF;-DGGML_SSE42=ON;-DGGML_AVX=OFF;-DGGML_AVX2=OFF;-DGGML_BMI2=OFF;-DGGML_FMA=OFF;-DGGML_F16C=OFF
              base:-DGGML_NATIVE=OFF;-DGGML_AVX512=OFF;-DGGML_AVX_VNNI=OFF;-DGGML_SSE42=OFF;-DGGML_AVX=OFF;-DGGML_AVX2=OFF;-DGGML_BMI2=OFF;-DGGML_FMA=OFF;-DGGML_F16C=OFF
          - name: AArch64
            runner: ubuntu-24.04-arm
            builds: >-
              native:-DGGML_NATIVE=ON
              dotprod:-DGGML_NATIVE=OFF;-DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod
              base:-DGGML_NATIVE=OFF;-DGGML_CPU_ARM_ARCH=armv8-a
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps
        run: |
          .github/scripts/apt-install.sh python3-numpy
          pip install --user --break-system-packages pyarrow
      - name: CPU
        run: lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | cut -c1-400
      - name: Build llama.cpp
        env:
          TAG: ${{ inputs.llama_cpp || 'b11835' }}
          BUILDS: ${{ matrix.builds }}
        run: |
          git clone -q --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp ../llama.cpp
          cd ../llama.cpp
          for b in $BUILDS; do
            name=${b%%:*}; opts=$(echo "${b#*:}" | tr ';' ' ')
            targets="llama-bench"; [ $name = native ] && targets="llama-bench llama-perplexity llama-quantize"
            cmake -S . -B build-$name -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=OFF \
              -DBUILD_SHARED_LIBS=OFF $opts > /dev/null
            cmake --build build-$name -j "$(nproc)" --target $targets > build-$name.log 2>&1 ||
              { tail -n 20 build-$name.log; exit 1; }
          done
      - name: Model and text
        run: |
          mkdir -p ../data/qwen
          hf=https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/resolve/main
          for f in config.json tokenizer.json model.safetensors; do curl -fsSL -o ../data/qwen/$f $hf/$f; done
          curl -fsSL -o ../data/f16.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-fp16.gguf
          curl -fsSL -o ../data/wiki.parquet \
            https://huggingface.co/datasets/Salesforce/wikitext/resolve/main/wikitext-2-raw-v1/test-00000-of-00001.parquet
          python3 -c "import pyarrow.parquet as pq, sys; open(sys.argv[2], 'w').write(''.join(pq.read_table(sys.argv[1])['text'].to_pylist()))" \
            ../data/wiki.parquet ../data/wiki.txt
          ls -la ../data ../data/qwen
      - name: Compare
        env:
          REPS: ${{ inputs.reps || '3' }}
          NAME: ${{ matrix.name }}
        run: |
          scripts/compare_llamacpp.sh ../llama.cpp ../data/qwen ../data/f16.gguf ../data/wiki.txt build/compare
          {
            echo "# $NAME: isa-lm ${GITHUB_SHA::7} against llama.cpp ${{ inputs.llama_cpp || 'b11835' }}"
            echo
            cat build/compare/results.md
          } >> "$GITHUB_STEP_SUMMARY"
          # the whole table in one annotation (readable through the checks API)
          echo "::notice title=compare $NAME::$(sed 's/%/%25/g' build/compare/results.md | awk '{printf "%s%%0A", $0}')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-${{ matrix.name }}
          path: build/compare/results.md
